name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e .

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

      - name: Tests on Linux with Tk display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging dependencies
        run: python -m pip install . pyinstaller
      - name: Fetch and verify bundled alice
        run: |
          python -m aindiff fetch-alice --dest "${{ runner.temp }}/aindiff-alice"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force vendor/alice
          $exe = Get-ChildItem "${{ runner.temp }}/aindiff-alice" -Filter alice.exe -Recurse
          Copy-Item -LiteralPath $exe.FullName -Destination vendor/alice/alice.exe
      - name: Build and test the portable package
        run: |
          python scripts/build_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AINDIFF_TEST_PACKAGE = (Get-ChildItem release/*-win64.zip).FullName
          python -m unittest discover -s tests -p test_integration.py -v
