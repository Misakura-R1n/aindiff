[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aindiff"
dynamic = ["version"]
description = "Side-by-side text editor for two AliceSoft .ain scenario files, powered by alice-tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aindiff contributors" }]
keywords = ["alicesoft", "ain", "alice-tools", "translation", "diff", "editor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Text Editors",
]
dependencies = []

[project.scripts]
aindiff = "aindiff.cli:main"

[project.urls]
Homepage = "https://github.com/nunuhara/alice-tools"
Documentation = "https://github.com/nunuhara/alice-tools#readme"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "aindiff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aindiff = ["assets/aindiff.png", "assets/aindiff.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
